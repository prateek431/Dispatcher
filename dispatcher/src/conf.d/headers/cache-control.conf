<IfModule mod_headers.c>
   <IfModule mod_expires.c>

   ExpiresActive On

   # HTML files – cache for 10 minutes
   <LocationMatch "\.(html|htm)$">
       Header always set Cache-Control "max-age=600, public"
   </LocationMatch>

   # Non-versioned clientlibs – cache for 2 days
   <LocationMatch "^/etc.clientlibs/.*(?<!\.min)\.(css|js)$">
       Header always set Cache-Control "max-age=172800, public"
   </LocationMatch>

   # Versioned clientlibs – cache for 1 month
   <LocationMatch "^/etc.clientlibs/.*\.(css|js)$">
       Header always set Cache-Control "max-age=2592000, public"
   </LocationMatch>

   # Assets – cache for 1 month
   <LocationMatch "\.(png|jpg|jpeg|gif|svg|woff|woff2|ttf|ico|mp4|pdf)$">
       Header always set Cache-Control "max-age=2592000, public"
   </LocationMatch>

   </IfModule>
   </IfModule>